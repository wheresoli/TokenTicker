<title>LLM API Token Price Index</title>
<style>
  :root {
    --bg: #fbfbf9;
    --panel: #ffffff;
    --ink: #1a1a17;
    --muted: #6b6b63;
    --faint: #9a9a90;
    --line: #e7e6df;
    --line-strong: #d8d7cd;
    --bar: #eeede6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e24;
      --ink: #ecebe6;
      --muted: #9c9c95;
      --faint: #6f6f68;
      --line: #2c2c33;
      --line-strong: #3a3a42;
      --bar: #2a2a31;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #fbfbf9; --panel: #ffffff; --ink: #1a1a17; --muted: #6b6b63; --faint: #9a9a90;
    --line: #e7e6df; --line-strong: #d8d7cd; --bar: #eeede6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"] {
    --bg: #16161a; --panel: #1e1e24; --ink: #ecebe6; --muted: #9c9c95; --faint: #6f6f68;
    --line: #2c2c33; --line-strong: #3a3a42; --bar: #2a2a31;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  /* Provider hues (--c-<slug>) are injected at runtime from pricing.json's `accent` /
     `accentDark` fields — see injectProviderColors() below — so adding a provider needs
     no edit here. The set is validated colorblind-safe in file order with the dataviz
     skill's validate_palette.js (adjacent gate, both surfaces); see README for the
     honest limits past 8 providers. A provider with L>0.67 (Anthropic, Moonshot amber)
     carries an `accentDark` shifted into the dark lightness band. */

  * { box-sizing: border-box; }
  .tpt {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: clamp(16px, 4vw, 40px);
    max-width: 1040px;
    margin: 0 auto;
  }
  .tpt a { color: inherit; }

  .tpt-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .tpt h1 { font-size: clamp(1.4rem, 3.5vw, 2rem); font-weight: 640; letter-spacing: -.02em; margin: 0; }
  .tpt-sub { color: var(--muted); font-size: .875rem; margin: 6px 0 0; }
  .tpt-sub b { color: var(--ink); font-weight: 600; }

  .tpt-theme {
    font: inherit; font-size: .8rem; color: var(--muted); cursor: pointer;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 6px 12px; transition: border-color .15s;
  }
  .tpt-theme:hover { border-color: var(--faint); }

  .tpt-calc {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 18px; margin: 20px 0 18px;
  }
  .tpt-calc-label { font-size: .82rem; color: var(--muted); font-weight: 560; }
  .tpt-field { display: inline-flex; align-items: baseline; gap: 7px; }
  .tpt-field label { font-size: .82rem; color: var(--muted); }
  .tpt-field input {
    font: inherit; font-family: var(--mono); font-size: .85rem; color: var(--ink);
    width: 8ch; text-align: right; background: transparent;
    border: none; border-bottom: 1.5px solid var(--line-strong); padding: 2px 2px;
  }
  .tpt-field input:focus { outline: none; border-bottom-color: var(--ink); }
  .tpt-presets { display: inline-flex; gap: 6px; margin-left: auto; }
  .tpt-chip {
    font: inherit; font-size: .76rem; color: var(--muted); cursor: pointer;
    background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 10px;
  }
  .tpt-chip:hover { border-color: var(--faint); color: var(--ink); }

  .tpt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); background: var(--panel); }
  table.tpt-tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
  /* transparent value wrapper: vanishes in the table, becomes the value box in card mode */
  .tpt-v { display: contents; }
  .tpt-tbl thead th {
    position: sticky; top: 0; z-index: 1; background: var(--panel);
    text-align: right; font-weight: 580; font-size: .74rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); padding: 12px 14px; border-bottom: 1.5px solid var(--line-strong);
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  .tpt-tbl thead th:first-child, .tpt-tbl thead th.l { text-align: left; }
  .tpt-tbl thead th .arw { opacity: 0; margin-left: 4px; font-size: .7rem; }
  .tpt-tbl thead th[aria-sort] .arw { opacity: 1; }
  .tpt-tbl tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .tpt-tbl td.tpt-td-model { white-space: normal; min-width: 8.5rem; }
  /* Notes must wrap; two-class selector to beat the blanket `td { nowrap }` above */
  .tpt-tbl td.tpt-note { white-space: normal; }
  .tpt-tbl tbody tr:last-child td { border-bottom: none; }
  .tpt-tbl tbody tr:hover td { background: color-mix(in srgb, var(--ink) 3.5%, transparent); }
  .tpt-tbl td.l { text-align: left; }

  .tpt-model { font-weight: 580; }
  .tpt-id { font-family: var(--mono); font-size: .72rem; color: var(--faint); margin-top: 2px; }
  .tpt-badge { display: inline-flex; align-items: center; gap: 7px; font-weight: 560; }
  .tpt-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .tpt-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tpt-cached { display: block; font-size: .68rem; color: var(--faint); margin-top: 2px; }
  /* Rigorous, computed tags — a wrapping row of compact pills under the model name.
     Every value is derived from the price/context data (FACETS + tagPills below), so a
     tag can't drift from the number it describes. The price band carries a subtle
     cheap→green / pricey→warm tint (this is a price index); other facets stay neutral so
     the row reads calmly. Each pill's title spells out the exact cut-off. */
  .tpt-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 2px; }
  .tpt-tag { display: inline-flex; align-items: center; font-size: .64rem; line-height: 1.6; color: var(--muted); background: var(--bar); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
  .tpt-tag-tier { color: var(--ink); font-weight: 640; }
  .tpt-tag-price { color: var(--ink); }
  .tpt-tag-price[data-band="premium"] { background: color-mix(in srgb, #d97757 24%, var(--bar)); }
  .tpt-tag-price[data-band="value"]   { background: color-mix(in srgb, #37a862 18%, var(--bar)); }
  .tpt-tag-price[data-band="budget"]  { background: color-mix(in srgb, #37a862 30%, var(--bar)); }
  .tpt-ctx { color: var(--muted); font-family: var(--mono); font-size: .82rem; }

  .tpt-cell-call { position: relative; }
  .tpt-callbar { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 26px; border-radius: 6px; opacity: .16; z-index: 0; }
  .tpt-callval { position: relative; z-index: 1; font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 560; }

  .tpt-note { font-size: .72rem; color: var(--muted); text-align: left; white-space: normal; max-width: 22ch; }

  .tpt-foot { margin-top: 22px; font-size: .8rem; color: var(--muted); }
  .tpt-foot p { margin: 6px 0; }
  .tpt-srcs { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 8px 0; }
  .tpt-srcs a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--faint); }
  .tpt-srcs a:hover { color: var(--ink); }
  .tpt-disc { font-size: .78rem; padding: 11px 14px; background: var(--bar); border-radius: 10px; color: var(--muted); margin-top: 12px; }

  /* View toggle + live/snapshot status */
  .tpt-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 18px 0 0; }
  .tpt-seg { display: inline-flex; background: var(--bar); border-radius: 999px; padding: 3px; gap: 2px; }
  .tpt-seg button { font: inherit; font-size: .82rem; color: var(--muted); cursor: pointer; background: transparent; border: none; border-radius: 999px; padding: 6px 15px; }
  .tpt-seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 560; }
  .tpt-status { font-size: .76rem; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; margin-left: auto; }
  .tpt-live { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .tpt-status.is-live .tpt-live { background: #2fb170; box-shadow: 0 0 0 3px color-mix(in srgb, #2fb170 22%, transparent); }

  /* Views */
  .tpt-view-table.off, .tpt-trends { display: none; }
  .tpt-trends.on { display: block; }
  .tpt-chartcard { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); background: var(--panel); padding: 16px 18px 18px; margin-top: 16px; }
  .tpt-chartbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 10px; }
  .tpt-mini { display: inline-flex; background: var(--bar); border-radius: 9px; padding: 2px; gap: 2px; }
  .tpt-mini button { font: inherit; font-size: .76rem; color: var(--muted); cursor: pointer; background: transparent; border: none; border-radius: 7px; padding: 5px 11px; }
  .tpt-mini button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 560; }
  .tpt-mini-label { font-size: .72rem; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .tpt-chart { width: 100%; height: auto; display: block; overflow: visible; }
  .tpt-chart .grid { stroke: var(--line); stroke-width: 1; }
  .tpt-chart .axis { stroke: var(--line-strong); stroke-width: 1; }
  .tpt-chart .tick { fill: var(--faint); font-family: var(--mono); font-size: 10px; }
  .tpt-chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .tpt-chart .dot { stroke: var(--panel); stroke-width: 1.5; }
  .tpt-chart .endlab { font-family: var(--sans); font-size: 10px; font-weight: 600; }
  .tpt-chart .lead { stroke-width: 1; opacity: .45; }
  .tpt-chart .hit { fill: transparent; }
  /* Hover-to-isolate: JS delays adding .tpt-hovering by ~500ms so passing the cursor
     over the chart doesn't flicker; removal on mouseout is instant (see script). */
  .tpt-chart .tpt-series { transition: opacity .18s ease; }
  .tpt-charthost.tpt-hovering .tpt-chart .tpt-series { opacity: .28; }
  .tpt-charthost.tpt-hovering .tpt-chart .tpt-series.tpt-hot { opacity: 1; }
  .tpt-empty { color: var(--muted); font-size: .85rem; text-align: center; padding: 40px 10px; }
  /* Series picker: quick presets + provider-grouped toggles (replaces a flat 30-pill wall) */
  .tpt-legbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 16px; }
  .tpt-legchips { display: inline-flex; gap: 6px; }
  .tpt-selcount { margin-left: auto; font-size: .74rem; color: var(--faint); font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Tag combobox: a popover of the computed tags grouped by facet. Each tag is a
     tri-state toggle (on / some / off vs the current plot) that adds or removes its
     models — same interaction as the provider headers, so the two selectors compose. */
  .tpt-combo { position: relative; display: inline-flex; }
  .tpt-combo-btn { font: inherit; font-size: .76rem; color: var(--ink); cursor: pointer; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 11px; display: inline-flex; align-items: center; gap: 6px; max-width: 16rem; }
  .tpt-combo-btn:hover { border-color: var(--faint); }
  .tpt-combo.has-sel .tpt-combo-btn { border-color: var(--faint); font-weight: 560; }
  .tpt-combo-cap { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tpt-caret { color: var(--faint); font-size: .7rem; }
  .tpt-combo-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; width: min(88vw, 520px); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; }
  .tpt-combo.open .tpt-combo-panel { display: block; }
  .tpt-combo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px 16px; }
  .tpt-facet-name { font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; margin: 0 0 3px; }
  .tpt-tagopt { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; font: inherit; font-size: .78rem; cursor: pointer; background: transparent; border: none; border-radius: 6px; padding: 3px 5px; color: var(--ink); }
  .tpt-tagopt:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .tpt-tagbox { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line-strong); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; color: var(--panel); }
  .tpt-tagopt[data-state="on"] .tpt-tagbox { background: var(--ink); border-color: var(--ink); }
  .tpt-tagopt[data-state="some"] .tpt-tagbox { background: var(--faint); border-color: var(--faint); }
  .tpt-tagopt-nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tpt-tagcount { margin-left: auto; padding-left: 6px; font-size: .68rem; color: var(--faint); font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Divider splits the two chip groups: [ Tags · Repriced ] | [ Default · All · Clear ] */
  .tpt-divider { width: 1px; height: 20px; align-self: center; background: var(--line-strong); margin: 0 2px; }
  /* Repriced chip states: `is-arming` = Ctrl/⌘ held (a modified click is queued);
     `is-filter-on` = the compound filter is active. When on, the chip and the tag combobox
     light in the SAME amber so the pair reads as one linked filter (tags AND repriced). */
  .tpt-chip-repriced.is-arming { border-color: color-mix(in srgb, #e0952f 62%, var(--line-strong)); color: var(--ink); }
  .tpt-chip-repriced.is-filter-on { background: color-mix(in srgb, #e0952f 26%, var(--panel)); border-color: color-mix(in srgb, #e0952f 68%, var(--line-strong)); color: var(--ink); font-weight: 580; box-shadow: 0 0 0 2px color-mix(in srgb, #e0952f 24%, transparent); }
  .tpt-combo.is-filtered .tpt-combo-btn { border-color: color-mix(in srgb, #e0952f 68%, var(--line-strong)); box-shadow: 0 0 0 2px color-mix(in srgb, #e0952f 24%, transparent); }

  .tpt-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; margin-top: 10px; }
  .tpt-group { border: 1px solid var(--line); border-radius: 11px; background: var(--panel); padding: 6px 7px 7px; transition: opacity .15s; }
  .tpt-group[data-state="off"] { opacity: .6; }

  .tpt-grouphead { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; cursor: pointer; background: transparent; border: none; border-radius: 7px; padding: 4px 5px; color: var(--ink); }
  .tpt-grouphead:hover { background: color-mix(in srgb, var(--ink) 4.5%, transparent); }
  .tpt-gdot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
  .tpt-group[data-state="off"] .tpt-gdot { background: transparent !important; box-shadow: inset 0 0 0 2px var(--line-strong); }
  .tpt-gname { font-weight: 600; font-size: .82rem; letter-spacing: -.01em; }
  .tpt-gcount { margin-left: auto; font-size: .68rem; color: var(--faint); font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .tpt-groupmodels { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
  .tpt-leg { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .76rem; cursor: pointer; background: transparent; border: none; border-radius: 6px; padding: 4px 6px 4px 7px; color: var(--ink); }
  .tpt-leg:hover { background: color-mix(in srgb, var(--ink) 4.5%, transparent); }
  .tpt-leg[aria-pressed="false"] { opacity: .4; }
  /* Selected but excluded by the Repriced filter: struck through, so the filter's effect
     is legible in the legend too (not just missing from the plot). */
  .tpt-leg.tpt-leg-out { opacity: .55; }
  .tpt-leg.tpt-leg-out .tpt-leg-nm { text-decoration: line-through; }
  .tpt-swatch { width: 16px; border-top: 3px solid var(--faint); border-radius: 2px; flex: none; }
  .tpt-leg-nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tpt-leg .lv { margin-left: auto; padding-left: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--faint); font-size: .72rem; }
  .tpt-hint { font-size: .75rem; color: var(--faint); margin: 14px 0 0; }

  /* Narrow screens: collapse each row into a stacked card so nothing scrolls sideways. */
  @media (max-width: 820px) {
    .tpt-wrap { overflow-x: visible; }
    .tpt-tbl { display: block; }
    .tpt-tbl thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .tpt-tbl tbody { display: block; }
    .tpt-tbl tr { display: block; padding: 15px 16px; border-bottom: 1px solid var(--line); }
    .tpt-tbl tbody tr:hover td { background: transparent; }
    .tpt-tbl td { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; padding: 3px 0; border: none; text-align: right; white-space: normal; }
    .tpt-tbl td::before { content: attr(data-label); flex: none; color: var(--muted); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; text-align: left; }
    .tpt-tbl .tpt-v { display: block; text-align: right; }
    /* Provider + model form the card's title block — no label, left aligned */
    .tpt-tbl td.tpt-td-prov, .tpt-tbl td.tpt-td-model { display: block; text-align: left; min-width: 0; }
    .tpt-tbl td.tpt-td-prov::before, .tpt-tbl td.tpt-td-model::before { content: none; }
    .tpt-tbl td.tpt-td-model { margin: 2px 0 10px; }
    .tpt-tbl td.tpt-td-prov .tpt-v, .tpt-tbl td.tpt-td-model .tpt-v { text-align: left; }
    .tpt-tbl td.tpt-td-model .tpt-model { font-size: 1.02rem; }
    .tpt-tbl td.tpt-blank { display: none; }
    .tpt-callbar { display: none; }
    .tpt-cell-call { position: static; }
    .tpt-note { max-width: none; }
  }
</style>

<div class="tpt">
  <div class="tpt-head">
    <div>
      <h1 id="tpt-title">LLM API Token Price Index</h1>
      <p class="tpt-sub" id="tpt-sub"></p>
    </div>
    <button class="tpt-theme" id="tpt-theme" type="button" aria-label="Toggle light/dark theme">◐ Theme</button>
  </div>

  <div class="tpt-calc">
    <span class="tpt-calc-label">Estimate a call:</span>
    <span class="tpt-field"><label for="tpt-in">input</label><input id="tpt-in" type="number" min="0" step="1000" value="10000"><span style="color:var(--faint);font-size:.8rem">tok</span></span>
    <span class="tpt-field"><label for="tpt-out">output</label><input id="tpt-out" type="number" min="0" step="500" value="2000"><span style="color:var(--faint);font-size:.8rem">tok</span></span>
    <span class="tpt-presets">
      <button class="tpt-chip" data-in="2000" data-out="500" type="button">short</button>
      <button class="tpt-chip" data-in="10000" data-out="2000" type="button">typical</button>
      <button class="tpt-chip" data-in="100000" data-out="4000" type="button">long ctx</button>
    </span>
  </div>

  <div class="tpt-controls">
    <span class="tpt-seg" role="group" aria-label="View">
      <button data-view="table" type="button" aria-pressed="true">Table</button>
      <button data-view="trends" type="button" aria-pressed="false">Trends</button>
    </span>
    <span class="tpt-status" id="tpt-status" title="Price source">
      <span class="tpt-live"></span><span class="tpt-txt">snapshot</span>
    </span>
  </div>

  <div class="tpt-view-table" id="view-table">
  <div class="tpt-wrap">
    <table class="tpt-tbl" aria-label="LLM API token pricing">
      <thead>
        <tr>
          <th class="l" data-k="provider">Provider<span class="arw"></span></th>
          <th class="l" data-k="name">Model<span class="arw"></span></th>
          <th data-k="input">Input <span style="text-transform:none;font-weight:500">$/1M</span><span class="arw"></span></th>
          <th data-k="output">Output <span style="text-transform:none;font-weight:500">$/1M</span><span class="arw"></span></th>
          <th data-k="call">Cost / call<span class="arw"></span></th>
          <th data-k="context">Context<span class="arw"></span></th>
          <th class="l">Notes</th>
        </tr>
      </thead>
      <tbody id="tpt-body"></tbody>
    </table>
  </div>
  </div><!-- /view-table -->

  <div class="tpt-trends" id="view-trends">
    <div class="tpt-chartcard">
      <div class="tpt-chartbar">

  const $ = (s, r = document) => r.querySelector(s);
  const body = $("#tpt-body");
  const inEl = $("#tpt-in");
  const outEl = $("#tpt-out");

  // Flatten providers -> rows
  const provSlug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, "-");

  // Provider colors come from the data (accent / accentDark), not hardcoded CSS, so a
  // new provider in pricing.json is fully self-describing. Injected before first render
  // so var(--c-<slug>) resolves for dots, call-bars, and chart series.
  (function injectProviderColors() {
    const decl = (k) => DATA.providers
      .map(p => `--c-${provSlug(p.name)}:${p[k] || p.accent};`).join("");
    const light = decl("accent"), dark = decl("accentDark");
    const el = document.createElement("style");
    el.textContent = `:root{${light}}`
      + `@media (prefers-color-scheme:dark){:root{${dark}}}`
      + `:root[data-theme="light"]{${light}}`
      + `:root[data-theme="dark"]{${dark}}`;
    (document.head || document.documentElement).appendChild(el);
  })();

  const rows = DATA.providers.flatMap(p =>
    p.models.map((m, i) => ({
      provider: p.name, pslug: provSlug(p.name), pvar: `var(--c-${provSlug(p.name)})`,
      name: m.name, id: m.id, key: `${p.name}:${m.id}`, tier: m.tier, widx: i,
      input: m.input, output: m.output, cachedInput: m.cachedInput,
      context: m.context, note: m.note || ""
    }))
  );

  const ctxRank = s => { const n = parseFloat(s); return /M/i.test(s) ? n * 1000 : n; };
  const callCost = r => (Number(inEl.value) || 0) / 1e6 * r.input + (Number(outEl.value) || 0) / 1e6 * r.output;

  const money = n => n >= 1 ? "$" + n.toFixed(2)
    : "$" + (n >= 0.1 ? n.toFixed(3) : n >= 0.01 ? n.toFixed(4) : n.toFixed(5)).replace(/0+$/, "").replace(/\.$/, "");
  // Cached-input prices can be sub-cent (e.g. DeepSeek's $0.0036); show enough
  // precision that a real price never collapses to a misleading "$0.00".
  const cmoney = n => n >= 0.01 ? "$" + n.toFixed(2)
    : "$" + n.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
  const callFmt = n => {
    const dp = n >= 0.1 ? 3 : n >= 0.01 ? 4 : 5;
    return "$" + n.toFixed(dp);
  };

  // ---- Rigorous, computed tags -------------------------------------------------
  // Every tag is derived from the price/context numbers, so it can't drift from the
  // data: change a price and its band / output-ratio / cache tag recompute. The lone
  // exception is `tier`, which is the model's position in its provider's own lineup.
  // Each value's title spells out the exact cut-off (also documented in the README).
  const blended = r => r.input + r.output;                       // transparent $/1M proxy
  const outRatio = r => r.input > 0 ? r.output / r.input : 0;
  const cacheX = r => (r.cachedInput != null && r.cachedInput > 0) ? r.input / r.cachedInput : null;
  const trim1 = n => (Math.round(n * 10) / 10).toString();       // 5, 6.3 — drop trailing .0

  const FACETS = [
    {
      key: "tier", name: "Tier", order: ["frontier", "flagship", "workhorse", "small"],
      def: {
        frontier:  { label: "Frontier",  title: "Tier — the provider's most capable / newest model" },
        flagship:  { label: "Flagship",  title: "Tier — primary top-line model" },
        workhorse: { label: "Workhorse", title: "Tier — balanced cost/quality default" },
        small:     { label: "Small",     title: "Tier — smallest / fastest in the family" },
      },
      of: r => r.tier,
    },
    {
      key: "price", name: "Price band", order: ["premium", "standard", "value", "budget"],
      def: {
        premium:  { label: "Premium",  title: "Price band — blended input+output ≥ $15 / 1M" },
        standard: { label: "Standard", title: "Price band — blended input+output $4–15 / 1M" },
        value:    { label: "Value",    title: "Price band — blended input+output $1–4 / 1M" },
        budget:   { label: "Budget",   title: "Price band — blended input+output < $1 / 1M" },
      },
      of: r => { const b = blended(r); return b >= 15 ? "premium" : b >= 4 ? "standard" : b >= 1 ? "value" : "budget"; },
    },
    {
      key: "ctx", name: "Context", order: ["ctx1m", "ctxlong", "ctxstd"],
      def: {
        ctx1m:   { label: "1M ctx",       title: "Context window ≥ 1M tokens" },
        ctxlong: { label: "Long ctx",     title: "Context window 200K – 1M tokens" },
        ctxstd:  { label: "Standard ctx", title: "Context window < 200K tokens" },
      },
      of: r => { const k = ctxRank(r.context); return k >= 1000 ? "ctx1m" : k >= 200 ? "ctxlong" : "ctxstd"; },

        cachesome: { label: "Some cache", title: "Cached-input discount present but < 10×" },

      key: "out", name: "Output ratio", order: ["outsteep", "outmod", "outflat"],

    rows.forEach(r => { r.tags = FACETS.map(f => f.of(r)); });
    FACETS.forEach(f => f.order.forEach(id => keysByTag[id] = []));
    rows.forEach(r => r.tags.forEach(id => keysByTag[id].push(r.key)));
  }
  recomputeTags();

  const tagPills = r => FACETS.map((f, i) => {
    const id = r.tags[i], d = f.def[id];
    const txt = f.badge ? f.badge(r) : d.label;
    const cls = "tpt-tag" + (f.key === "tier" ? " tpt-tag-tier" : f.key === "price" ? " tpt-tag-price" : "");
    const band = f.key === "price" ? ` data-band="${id}"` : "";
    return `<span class="${cls}"${band} title="${d.title}">${txt}</span>`;
  }).join("");

  let sort = { k: "call", dir: "asc" };

  function valueFor(r, k) {
    if (k === "call") return callCost(r);
    if (k === "context") return ctxRank(r.context);
    return r[k];
  }

  function render() {
    const maxCall = Math.max(...rows.map(r => callCost(r)));
    const sorted = [...rows].sort((a, b) => {
      let va = valueFor(a, sort.k), vb = valueFor(b, sort.k);
      if (typeof va === "string") { va = va.toLowerCase(); vb = vb.toLowerCase(); }
      const c = va < vb ? -1 : va > vb ? 1 : 0;
      return sort.dir === "asc" ? c : -c;
    });

    body.innerHTML = sorted.map(r => {
      const c = callCost(r);
      const pct = maxCall > 0 ? (c / maxCall * 100) : 0;
      const cached = r.cachedInput != null
        ? `<span class="tpt-cached">cached in ${cmoney(r.cachedInput)}</span>` : "";
      return `<tr>
        <td class="l tpt-td-prov" data-label="Provider"><div class="tpt-v"><span class="tpt-badge"><span class="tpt-dot" style="background:${r.pvar}"></span>${r.provider}</span></div></td>
        <td class="l tpt-td-model" data-label="Model"><div class="tpt-v"><div class="tpt-model">${r.name}</div><div class="tpt-tags">${tagPills(r)}</div><div class="tpt-id">${r.id}</div></div></td>
        <td data-label="Input $/1M"><div class="tpt-v"><span class="tpt-num">${money(r.input)}</span>${cached}</div></td>
        <td data-label="Output $/1M"><div class="tpt-v"><span class="tpt-num">${money(r.output)}</span></div></td>
        <td class="tpt-cell-call" data-label="Cost / call"><span class="tpt-callbar" style="width:${pct}%;background:${r.pvar}"></span><div class="tpt-v"><span class="tpt-callval">${callFmt(c)}</span></div></td>
        <td data-label="Context"><div class="tpt-v"><span class="tpt-ctx">${r.context}</span></div></td>
        <td class="tpt-note${r.note ? "" : " tpt-blank"}" data-label="Notes"><div class="tpt-v">${r.note}</div></td>
      </tr>`;
    }).join("");

    document.querySelectorAll(".tpt-tbl thead th[data-k]").forEach(th => {
      const k = th.dataset.k;
      const arw = th.querySelector(".arw");
      if (k === sort.k) { th.setAttribute("aria-sort", sort.dir === "asc" ? "ascending" : "descending"); arw.textContent = sort.dir === "asc" ? "▲" : "▼"; }
      else { th.removeAttribute("aria-sort"); arw.textContent = ""; }
    });
  }

  document.querySelectorAll(".tpt-tbl thead th[data-k]").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      const textCol = k === "provider" || k === "name";
      if (sort.k === k) sort.dir = sort.dir === "asc" ? "desc" : "asc";
      else sort = { k, dir: textCol ? "asc" : (k === "context" ? "desc" : "asc") };
      render();
    });
  });

  [inEl, outEl].forEach(el => el.addEventListener("input", () => { render(); renderChart(); renderLegend(); }));
  document.querySelectorAll(".tpt-presets .tpt-chip").forEach(chip => chip.addEventListener("click", () => {
    inEl.value = chip.dataset.in; outEl.value = chip.dataset.out; render(); renderChart(); renderLegend();
  }));

  // Header meta + sources + disclaimer
  $("#tpt-title").textContent = DATA.meta.title;
  $("#tpt-sub").innerHTML = `${DATA.meta.unit} &middot; ${DATA.meta.tier} &middot; updated <b>${DATA.meta.updated}</b>`;
  $("#tpt-srcs").innerHTML = "Sources: " + DATA.providers.map(p =>
    `<a href="${p.source}" target="_blank" rel="noopener">${p.name} <span style="color:var(--faint)">(refreshed ${p.verified})</span></a>`
  ).join("");
  $("#tpt-disc").textContent = DATA.meta.disclaimer;

  // Theme toggle (standalone use; the host's theme still applies otherwise)
  const themeBtn = $("#tpt-theme");
  themeBtn.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? "dark"
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
  });

  // ---- Trends / history chart ------------------------------------------------
  const chartHost = $("#tpt-chart-host");
  const legendEl = $("#tpt-legend");
  const hintEl = $("#tpt-hint");
  const selCountEl = $("#tpt-selcount");
  const rowByKey = new Map(rows.map(r => [r.key, r]));
  const rowsByProv = DATA.providers.map(p => ({ name: p.name, pvar: `var(--c-${provSlug(p.name)})`, rows: rows.filter(r => r.provider === p.name) }));
  const DASH = ["", "5 4", "1.5 4", "8 3 1.5 3"]; // within-provider variants (secondary encoding)
  // Two-layer selection: `sel` is the base set (what the combobox + legend reflect);
  // `filterRepriced` is a filter layered on top (Ctrl/⌘-click Repriced) that narrows the
  // *plot* to repriced models without disturbing the base set — so tags stay visible.
  const chart = { metric: "input", scale: "log", sel: new Set(), filterRepriced: false };
  // Default plot: the "best" models — everything tagged Frontier or Flagship. Mirrors
  // the tag combobox (which opens with those two tags checked) and the Default chip.
  function selectDefault() {
    chart.sel.clear();
    rows.forEach(r => { if (r.tier === "frontier" || r.tier === "flagship") chart.sel.add(r.key); });
  }
  selectDefault();
  const today = new Date().toISOString().slice(0, 10);

  // A model is "repriced" if its input or output moved across the recorded snapshots — a
  // real computed signal (not a label), starting near-empty and lighting up as history
  // accrues. Live: after a runtime refresh today's snapshot reflects the feed too.
  const isRepriced = key => {
    const seq = HISTORY.snapshots.map(s => s.prices[key]).filter(Boolean);
    if (seq.length < 2) return false;
    return seq.some(p => p.in !== seq[0].in) || seq.some(p => p.out !== seq[0].out);
  };
  // The plotted keys = base selection, optionally narrowed by the Repriced filter.
  const plottedKeys = () => chart.filterRepriced ? [...chart.sel].filter(isRepriced) : [...chart.sel];

  const metricVal = pr => {
    if (!pr) return null;
    if (chart.metric === "input") return pr.in;
    if (chart.metric === "output") return pr.out;
    return (Number(inEl.value) || 0) / 1e6 * pr.in + (Number(outEl.value) || 0) / 1e6 * pr.out;
  };
  const metricLabel = () => chart.metric === "input" ? "Input $/1M"
    : chart.metric === "output" ? "Output $/1M" : "Cost per call ($)";
  const seriesFor = key => HISTORY.snapshots
    .map(s => ({ date: s.date, v: metricVal(s.prices[key]) }))
    .filter(p => p.v != null);
  const fmtVal = v => chart.metric === "call"
    ? "$" + (v >= 0.1 ? v.toFixed(3) : v >= 0.01 ? v.toFixed(4) : v.toFixed(5))
    : "$" + v.toFixed(2);
  const tickLab = t => t >= 1 ? "$" + (Number.isInteger(t) ? t : +t.toFixed(1)) : "$" + (+t.toFixed(t >= 0.1 ? 1 : 2));
  const niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; };
  function yTicks(min, max, log) {
    if (log) { const out = []; for (let k = Math.floor(Math.log10(min)); k <= Math.ceil(Math.log10(max)); k++) out.push(Math.pow(10, k)); return out.filter(t => t >= min * 0.999 && t <= max * 1.001); }
    const step = niceStep((max - min) / 4 || 1), out = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }

  function renderChart() {
    clearTimeout(hoverTimer); hoverTarget = null; chartHost.classList.remove("tpt-hovering");
    const dates = HISTORY.snapshots.map(s => s.date);
    const series = plottedKeys().filter(k => rowByKey.has(k))
      .map(k => ({ row: rowByKey.get(k), pts: seriesFor(k) })).filter(s => s.pts.length);
    if (!series.length) {
      const msg = chart.filterRepriced && chart.sel.size
        ? `None of your ${chart.sel.size} selected model${chart.sel.size > 1 ? "s have" : " has"} repriced across the recorded history yet.`
        : `Pick one or more models below to plot them.`;
      chartHost.innerHTML = `<div class="tpt-empty">${msg}</div>`; return;
    }

    // Layout adapts to the selection: the right gutter widens to fit the longest *full*
    // model name (no truncation), and the plot grows tall enough that every end-label
    // gets its own row — so 30 series read as a clean list instead of a pile of "…".
    const N = series.length;
    const LINE = 12;                                                     // label row height
    const longest = Math.max(...series.map(s => s.row.name.length));
    const W = 760, m = {
      t: 14, b: 30, l: 50,
      r: Math.min(232, Math.max(96, Math.round(longest * 5.8) + 34)),    // dot + name + pad
    };
    const ph = Math.max(300, N * LINE + 16);
    const H = m.t + m.b + ph;
    const pw = W - m.l - m.r;

    const vals = series.flatMap(s => s.pts.map(p => p.v));
    let vMin = Math.min(...vals), vMax = Math.max(...vals);
    const log = chart.scale === "log" && vMin > 0;
    if (log) { vMin = Math.pow(10, Math.floor(Math.log10(vMin))); vMax = Math.pow(10, Math.ceil(Math.log10(vMax))); }
    else { const pad = (vMax - vMin) * 0.08 || vMax * 0.12 || 1; vMin = Math.max(0, vMin - pad); vMax += pad; }
    if (vMax === vMin) vMax = vMin + 1;
    const xi = i => m.l + (dates.length === 1 ? pw / 2 : i / (dates.length - 1) * pw);
    const xByDate = new Map(dates.map((d, i) => [d, xi(i)]));
    const ys = v => { const t = log ? (Math.log10(v) - Math.log10(vMin)) / (Math.log10(vMax) - Math.log10(vMin)) : (v - vMin) / (vMax - vMin); return m.t + (1 - t) * ph; };

    let svg = `<svg class="tpt-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${metricLabel()} over time">`;
    yTicks(vMin, vMax, log).forEach(t => { const y = ys(t); svg += `<line class="grid" x1="${m.l}" y1="${y.toFixed(1)}" x2="${W - m.r}" y2="${y.toFixed(1)}"/><text class="tick" x="${m.l - 8}" y="${(y + 3).toFixed(1)}" text-anchor="end">${tickLab(t)}</text>`; });
    // Thin x-axis labels to ~7 max so a long daily history doesn't smear into an
    // unreadable band; always keep the most recent date, drop any that would crowd it.
    const xStep = Math.max(1, Math.ceil(dates.length / 7));
    dates.forEach((d, i) => {
      const last = i === dates.length - 1;
      if (!last && (i % xStep !== 0 || dates.length - 1 - i < xStep * 0.6)) return;
      svg += `<text class="tick" x="${xi(i).toFixed(1)}" y="${H - m.b + 16}" text-anchor="middle">${d.slice(5)}</text>`;
    });
    svg += `<line class="axis" x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}"/>`;
    const labels = [], partsByKey = new Map();
    series.forEach(s => {
      const col = s.row.pvar, dash = DASH[s.row.widx % DASH.length];
      const pts = s.pts.map(p => ({ x: xByDate.get(p.date), y: ys(p.v), v: p.v, date: p.date })).filter(p => p.x != null);
      let part = "";
      if (pts.length > 1) part += `<path class="series" style="stroke:${col}" stroke-dasharray="${dash}" d="M${pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L")}"/>`;
      pts.forEach((p, i) => { part += `<circle class="dot" style="fill:${col}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}"><title>${s.row.name} — ${p.date}: ${fmtVal(p.v)}</title></circle>`; });
      partsByKey.set(s.row.key, part);
      const last = pts[pts.length - 1];
      labels.push({ key: s.row.key, x: last.x, dy: last.y, y: last.y, col, text: s.row.name });
    });
    // Declutter end-labels: they collide wherever series share a price. Keep them in
    // price order but enforce a one-row min gap, nudging the stack up if it spills past
    // the bottom (the plot was sized so the whole column fits). A hairline leader + a
    // color bullet tie each label back to its line.
    const GAP = LINE, top = m.t + 4, bot = H - m.b;
    labels.sort((a, b) => a.dy - b.dy);
    for (let i = 1; i < labels.length; i++)
      if (labels[i].y - labels[i - 1].y < GAP) labels[i].y = labels[i - 1].y + GAP;
    const overflow = labels.length ? labels[labels.length - 1].y - bot : 0;
    if (overflow > 0) for (const l of labels) l.y = Math.max(top, l.y - overflow);
    // Each series' line, dots and end-label share one <g> so hovering any of them can
    // fade every other group (see the hover handlers below). The invisible `.hit` rect
    // spans the whole label row — the label text itself is a fiddly hover target at 10px.
    labels.forEach(l => {
      svg += `<g class="tpt-series" data-key="${l.key}">${partsByKey.get(l.key) || ""}`;
      if (Math.abs(l.y - l.dy) > 1.5)
        svg += `<line class="lead" x1="${(l.x + 4).toFixed(1)}" y1="${l.dy.toFixed(1)}" x2="${(l.x + 8).toFixed(1)}" y2="${l.y.toFixed(1)}" style="stroke:${l.col}"/>`;
      svg += `<circle class="enddot" cx="${(l.x + 11).toFixed(1)}" cy="${l.y.toFixed(1)}" r="2.7" style="fill:${l.col}"/>`;
      svg += `<text class="endlab" x="${(l.x + 17).toFixed(1)}" y="${(l.y + 3.4).toFixed(1)}" style="fill:var(--ink)">${l.text}</text>`;
      svg += `<rect class="hit" x="${(W - m.r).toFixed(1)}" y="${(l.y - LINE / 2).toFixed(1)}" width="${m.r.toFixed(1)}" height="${LINE}"/>`;
      svg += `</g>`;
    });
    svg += `</svg>`;
    chartHost.innerHTML = svg;
  }
  // Hover-to-isolate: lights up one series' group and fades the rest (or clears when g is
  // null). Shared by the chart's own hover (delayed, below) and the legend's (instant).
  function setHotSeries(g) {
    chartHost.querySelectorAll(".tpt-series.tpt-hot").forEach(x => x.classList.remove("tpt-hot"));
    if (g) { g.classList.add("tpt-hot"); chartHost.classList.add("tpt-hovering"); }
    else chartHost.classList.remove("tpt-hovering");
  }
  // Resting on a series' line, dots, or end-label for ~500ms triggers the isolate above.
  // The wait avoids flicker while the cursor is only passing through a dense plot;
  // leaving drops the fade immediately since there's nothing to debounce on the way out.
  let hoverTimer = null, hoverTarget = null;
  chartHost.addEventListener("mouseover", e => {
    const g = e.target.closest(".tpt-series");
    if (!g || g === hoverTarget) return;
    clearTimeout(hoverTimer);
    hoverTarget = g;
    hoverTimer = setTimeout(() => setHotSeries(g), 500);
  });
  chartHost.addEventListener("mouseout", e => {
    const g = e.target.closest(".tpt-series");
    if (!g || (e.relatedTarget && g.contains(e.relatedTarget))) return;
    clearTimeout(hoverTimer);
    hoverTarget = null;
    setHotSeries(null);
  });
  // A mid-hover alt-tab can end the pointer sequence without a mouseout ever firing —
  // drop any pending isolate so the chart doesn't get stuck fading on refocus.
  window.addEventListener("blur", () => { clearTimeout(hoverTimer); hoverTarget = null; setHotSeries(null); });

  function renderLegend() {
    // Grouped by provider: a provider header (toggles all its models) over compact
    // per-model rows. Keeps 30 series scannable instead of a flat wall of pills.
    legendEl.innerHTML = rowsByProv.map(g => {
      const selN = g.rows.filter(r => chart.sel.has(r.key)).length;
      const state = selN === 0 ? "off" : selN === g.rows.length ? "on" : "some";
      const models = g.rows.map(r => {
        const on = chart.sel.has(r.key);
        const out = on && chart.filterRepriced && !isRepriced(r.key);   // selected but filtered out
        const s = seriesFor(r.key);
        const cur = s.length ? fmtVal(s[s.length - 1].v) : "—";
        const dash = DASH[r.widx % DASH.length] ? "border-top-style:dashed;" : "";
        return `<button class="tpt-leg${out ? " tpt-leg-out" : ""}" type="button" data-key="${r.key}" aria-pressed="${on}"${out ? ' title="Filtered out — not repriced"' : ""}>`
          + `<span class="tpt-swatch" style="border-top-color:${r.pvar};${dash}"></span>`
          + `<span class="tpt-leg-nm">${r.name}</span><span class="lv">${cur}</span></button>`;
      }).join("");
      return `<div class="tpt-group" data-state="${state}">`
        + `<button class="tpt-grouphead" type="button" data-prov="${g.name}" aria-pressed="${state === "on" ? "true" : state === "some" ? "mixed" : "false"}">`
        + `<span class="tpt-gdot" style="background:${g.pvar};color:${g.pvar}"></span>`
        + `<span class="tpt-gname">${g.name}</span>`
        + `<span class="tpt-gcount">${selN}/${g.rows.length}</span></button>`
        + `<div class="tpt-groupmodels">${models}</div></div>`;
    }).join("");
    const shown = plottedKeys().filter(k => rowByKey.has(k)).length;
    selCountEl.textContent = chart.filterRepriced
      ? `${shown} shown · ${chart.sel.size} selected · repriced`
      : `${chart.sel.size} of ${rows.length} shown`;
    const n = HISTORY.snapshots.length;
    const base = n <= 1
      ? "History has one snapshot so far — the daily workflow appends a point per day, and the lines grow from here."
      : `${n} daily snapshots · click a provider to toggle all its models · hover a point for its value.`;
    hintEl.textContent = chart.filterRepriced
      ? `${base} · Repriced filter on — Ctrl/⌘-click Repriced again to clear.`
      : base;
  }

  legendEl.addEventListener("click", e => {
    const model = e.target.closest(".tpt-leg");
    const head = e.target.closest(".tpt-grouphead");
    if (model) {
      const k = model.dataset.key;
      chart.sel.has(k) ? chart.sel.delete(k) : chart.sel.add(k);
    } else if (head) {
      const g = rowsByProv.find(x => x.name === head.dataset.prov);
      const allOn = g.rows.every(r => chart.sel.has(r.key));
      g.rows.forEach(r => allOn ? chart.sel.delete(r.key) : chart.sel.add(r.key));
    } else return;
    renderChart(); renderLegend(); syncCombo();
  });

  // Legend rows are already discrete, well-spaced targets (unlike the chart's
  // overlapping lines), so hovering one highlights its chart line immediately — no
  // 500ms wait. Looks up the series by key each time rather than caching a node,
  // since renderChart() can replace the chart's whole SVG between hovers.
  let legendHoverKey = null;
  const legendHover = e => {
    const row = e.target.closest(".tpt-leg");
    if (!row || row.dataset.key === legendHoverKey) return;
    legendHoverKey = row.dataset.key;
    clearTimeout(hoverTimer); hoverTarget = null;
    setHotSeries(chartHost.querySelector(`.tpt-series[data-key="${legendHoverKey}"]`));
  };
  const legendUnhover = e => {
    const row = e.target.closest(".tpt-leg");
    if (!row || (e.relatedTarget && row.contains(e.relatedTarget))) return;
    legendHoverKey = null;
    setHotSeries(null);
  };
  legendEl.addEventListener("mouseover", legendHover);
  legendEl.addEventListener("focusin", legendHover);
  legendEl.addEventListener("mouseout", legendUnhover);
  legendEl.addEventListener("focusout", legendUnhover);

  // ---- Tag combobox ----------------------------------------------------------
  const comboWrap = $("#tpt-combo"), comboBtn = $("#tpt-combo-btn"),
        comboPanel = $("#tpt-combo-panel"), comboCap = $("#tpt-combo-cap"),
        repricedBtn = $("#tpt-repriced");
  // A tag's state relative to the current plot: all its models shown / some / none.
  const tagState = id => {
    const ks = keysByTag[id]; if (!ks.length) return "off";
    let on = 0; for (const k of ks) if (chart.sel.has(k)) on++;
    return on === 0 ? "off" : on === ks.length ? "on" : "some";
  };
  function buildCombo() {
    comboPanel.innerHTML = `<div class="tpt-combo-grid">` + FACETS.map(f =>
      `<div class="tpt-facetcol"><p class="tpt-facet-name">${f.name}</p>` +
      f.order.filter(id => keysByTag[id].length).map(id =>
        `<button class="tpt-tagopt" type="button" data-tag="${id}" title="${f.def[id].title}">`
        + `<span class="tpt-tagbox" aria-hidden="true"></span>`
        + `<span class="tpt-tagopt-nm">${f.def[id].label}</span>`
        + `<span class="tpt-tagcount">${keysByTag[id].length}</span></button>`
      ).join("") + `</div>`
    ).join("") + `</div>`;
    syncCombo();
  }
  // Update states + caption in place (never re-innerHTML on click, so the clicked node
  // stays in the DOM and the outside-click closer doesn't fire on it).
  function syncCombo() {
    comboPanel.querySelectorAll(".tpt-tagopt").forEach(opt => {
      const st = tagState(opt.dataset.tag);
      opt.dataset.state = st;
      opt.setAttribute("aria-pressed", st === "on" ? "true" : st === "some" ? "mixed" : "false");
      opt.querySelector(".tpt-tagbox").textContent = st === "on" ? "✓" : st === "some" ? "–" : "";
    });
    // Caption: name the fully-selected tags, but fall back to a plain count for ad-hoc
    // picks (so a hand-picked selection never mislabels itself as "Tags").
    const on = [];
    FACETS.forEach(f => f.order.forEach(id => { if (keysByTag[id].length && tagState(id) === "on") on.push(f.def[id].label); }));
    comboCap.textContent = chart.sel.size === 0 ? "Tags"
      : chart.sel.size === rows.length ? "All models"
      : on.length ? (on.length <= 2 ? on.join(", ") : `${on[0]}, ${on[1]} +${on.length - 2}`)
      : `${chart.sel.size} models`;
    comboWrap.classList.toggle("has-sel", chart.sel.size > 0);
    reflectFilter();
  }
  // Dual highlight: the Repriced chip and the tag combobox light in the same amber while
  // the compound filter is active, so "these tags AND repriced" reads as a linked pair.
  function reflectFilter() {
    repricedBtn.classList.toggle("is-filter-on", chart.filterRepriced);
    repricedBtn.setAttribute("aria-pressed", chart.filterRepriced ? "true" : "false");
    comboWrap.classList.toggle("is-filtered", chart.filterRepriced);
  }
  comboPanel.addEventListener("click", e => {
    const opt = e.target.closest(".tpt-tagopt"); if (!opt) return;
    const ks = keysByTag[opt.dataset.tag];
    const allOn = ks.every(k => chart.sel.has(k));
    ks.forEach(k => allOn ? chart.sel.delete(k) : chart.sel.add(k));
    renderChart(); renderLegend(); syncCombo();
  });
  // Keep the popover on-screen: it's anchored to the button (near the left), so on a
  // narrow viewport a full-width panel would spill off the right. Pick the viewport x
  // that keeps it within an 8px margin, then express it relative to the anchor.
  function positionPanel() {
    const pad = 8;
    comboPanel.style.left = "0px";
    const origin = comboWrap.getBoundingClientRect().left;   // panel's offsetParent edge
    const pw = comboPanel.offsetWidth;
    const vw = document.documentElement.clientWidth;
    let x = origin;                                          // ideal: aligned under the button
    if (x + pw > vw - pad) x = vw - pad - pw;                // pull in from the right edge
    if (x < pad) x = pad;                                    // but never past the left edge
    comboPanel.style.left = (x - origin) + "px";
  }
  comboBtn.addEventListener("click", e => {
    e.stopPropagation();
    const open = comboWrap.classList.toggle("open");
    comboBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) positionPanel();
  });
  document.addEventListener("click", e => {
    if (comboWrap.classList.contains("open") && !comboWrap.contains(e.target)) {
      comboWrap.classList.remove("open"); comboBtn.setAttribute("aria-expanded", "false");
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && comboWrap.classList.contains("open")) {
      comboWrap.classList.remove("open"); comboBtn.setAttribute("aria-expanded", "false"); comboBtn.focus();
    }
  });

  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", e => {
    const p = b.dataset.preset;
    if (p === "repriced" && (e.ctrlKey || e.metaKey)) {
      // Ctrl/⌘-click: toggle the Repriced *filter* over the current selection. The base
      // selection (and the combobox tags) stay put; only the plot narrows.
      chart.filterRepriced = !chart.filterRepriced;
    } else if (p === "repriced") {
      // Plain click: hard-select every repriced model, dropping any active filter.
      chart.filterRepriced = false;
      chart.sel.clear(); rows.forEach(r => { if (isRepriced(r.key)) chart.sel.add(r.key); });
    } else if (p === "default") {
      chart.filterRepriced = false; selectDefault();
    } else if (p === "all") {
      chart.filterRepriced = false; chart.sel.clear(); rows.forEach(r => chart.sel.add(r.key));
    } else if (p === "none") {
      chart.filterRepriced = false; chart.sel.clear();
    }
    renderChart(); renderLegend(); syncCombo();
  }));
  // "Arm" the Repriced chip while Ctrl/⌘ is held, so a modified click reads as "filter"
  // before it lands — distinct from the persistent lit state once the filter is on.
  const setArm = e => repricedBtn.classList.toggle("is-arming", e.ctrlKey || e.metaKey);
  document.addEventListener("keydown", setArm);
  document.addEventListener("keyup", setArm);
  window.addEventListener("blur", () => repricedBtn.classList.remove("is-arming"));
  document.querySelectorAll("[data-metric]").forEach(b => b.addEventListener("click", () => {
    chart.metric = b.dataset.metric;
    document.querySelectorAll("[data-metric]").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderChart(); renderLegend();
  }));
  document.querySelectorAll("[data-scale]").forEach(b => b.addEventListener("click", () => {
    chart.scale = b.dataset.scale;
    document.querySelectorAll("[data-scale]").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderChart();
  }));
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.view;
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b));
    $("#view-table").classList.toggle("off", v !== "table");
    $("#view-trends").classList.toggle("on", v === "trends");
    if (v === "trends") renderChart();
  }));

  // Progressive enhancement: refresh current numbers live from the feed (Pages only;
  // the Artifact's CSP blocks it, so it silently falls back to the committed snapshot).
  async function refreshLive() {
    const status = $("#tpt-status"), txt = status.querySelector(".tpt-txt");
    try {
      const res = await fetch("https://openrouter.ai/api/v1/models", { headers: { accept: "application/json" } });
      if (!res.ok) throw 0;
      const feed = await res.json();
      const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
      const idx = new Map();
      (feed.data || []).forEach(mm => { if (mm && mm.pricing) idx.set(norm(mm.id), mm); });
      let n = 0;
      rows.forEach(r => {
        const src = idx.get(norm(r.provider) + norm(r.id)) || idx.get(norm(r.id));
        if (!src || !src.pricing) return;
        const inp = Math.round(Number(src.pricing.prompt) * 1e6 * 1e4) / 1e4;
        const out = Math.round(Number(src.pricing.completion) * 1e6 * 1e4) / 1e4;
        if (!(inp > 0 && out > 0 && inp < 1000 && out < 2000)) return;                 // sanity bounds
        if (Math.abs(inp - r.input) / (r.input || inp) > 0.6 ||
            Math.abs(out - r.output) / (r.output || out) > 0.6) return;                // ignore absurd jumps
        r.input = inp; r.output = out; n++;
      });
      if (n) {
        const prices = {}; rows.forEach(r => prices[r.key] = { in: r.input, out: r.output });
        const at = HISTORY.snapshots.findIndex(s => s.date === today);
        if (at >= 0) HISTORY.snapshots[at] = { date: today, prices }; else HISTORY.snapshots.push({ date: today, prices });
        recomputeTags();            // live prices can shift a band / ratio / cache tag
        render(); renderChart(); buildCombo();
        status.classList.add("is-live"); txt.textContent = `live · ${n}/${rows.length} · ${today}`;
        status.title = `${n} of ${rows.length} models refreshed live from the OpenRouter feed; the rest are the committed snapshot`;
      } else {
        // Feed reachable but no models matched — the table is still the committed snapshot.
        status.classList.remove("is-live"); txt.textContent = `snapshot · ${DATA.meta.updated}`;
        status.title = "Live feed reachable but no models matched — showing the committed snapshot";
      }
      renderLegend();
    } catch (e) {
      status.classList.remove("is-live"); txt.textContent = `snapshot · ${DATA.meta.updated}`;
      status.title = "Showing the committed snapshot (live feed not reachable in this context)";
    }
  }

  render();
  $("#tpt-status .tpt-txt").textContent = `snapshot · ${DATA.meta.updated}`;
  buildCombo();
  renderLegend();
  renderChart();
  refreshLive();
</script>
